# Logging configuration
logging:
  level: ERROR  # Logging level: DEBUG, INFO, WARNING, ERROR
  console: False  # Enable logging to console
  file: true  # Enable logging to file

# Radio hardware settings
radio:
  ip_address: ip:192.168.0.151  # IP address of SDR radio
  queue_size: 4000  # Max size of RX and TX queues.
  num_tui_msg: 100  # Number of messages to display in the TUI.
  debug_mode: true  # If True, the system will run in debug mode with live plotting of signals.

tui:
  frames_per_second: 10  # Target frames per second for TUI updates

# Link control settings
link_control:
  enable_ack: False          # Enable ACK mechanism
  enable_nack: False        # Enable NACK mechanism
  enable_retransmit: False   # Enable packet retransmission
  track_pending_data: False  # Track pending data

# Datagram format parameters
# These parameters are copies of the corresponding values in datagram.py.
# They are duplicated here to keep all configurable parameters in one place,
# but changes should be made in both places to maintain consistency.
datagram:
  ack_timeout_ms: 1000  # Timeout for ACK in milliseconds
  max_retries: 3  # Maximum number of retries
  msg_id_size: 1  # Size of message ID in bytes
  msg_type_size: 1  # Size of message type in bytes
  timestamp_size: 4  # Size of timestamp in bytes
  payload_length_size: 1  # Size of payload length in bytes
  payload_crc_size: 2  # Size of payload CRC in bytes
  payload_size: 23  # Size of payload in bytes
  header_size: 9  # Size of header in bytes
  total_size: 32  # Total size of datagram in bytes

# Transmitter settings
transmitter:
  tx_cyclic_buffer: False  # Enable/disable cyclic buffer
  tx_gain_dB: 0  # TX gain in dB, range: -90 to 0 dB
  tx_bandwidth: 1e6  # TX bandwidth in Hz
  tx_carrier: 867.5e6  # TX local oscillator (carrier frequency) in Hz
  tx_buffer_size: 1024  # TX buffer size in samples (2**10)
  tx_guard_symbols: 32  # Number of guard symbols (idle time) to insert between packets. Adjust based on expected channel conditions and timing requirements. More guard symbols can help with timing acquisition and reduce inter-packet interference, but also increase overhead.
  tx_peak_scale: 0.39  # Normalization factor for TX Burst, keeps burst even (less variation at operating point)

# Receiver settings
receiver:
  rx_gain_dB: 30  # RX gain in dB, range: 0 to 73 dB
  rx_bandwidth: 1e6  # RX bandwidth in Hz
  rx_carrier: 865.5e6  # RX local oscillator (carrier frequency) in Hz
  gain_mode: manual  # Gain mode: "manual" or Automatic Gain Control: "fast_attack", "slow_attack"
  buffer_size: 16384  # RX buffer size

# Modulation settings
modulation:
  type: QPSK          # Modulation type, BPSK or QPSK, QAM not supported
  order: 4            # Modulation order, 2 for BPSK 
  symbol_rate: 125e3  # Symbol rate in symbols/s
  samples_per_symbol: 8  # Samples per symbol
  sample_rate: 1e6  # Sample rate in Hz

# Coding settings
coding:
  rs_num_ecc: 8  # Reed-Solomon number of ECC bytes
  rs_added_bytes: 8  # Reed-Solomon added bytes
  conv_K: 7  # Convolutional code constraint length
  conv_n: 3  # Convolutional code n
  conv_datarate: 1/3  # Convolutional code data rate
  scrambler_seed: 93  # Scrambler seed
  scrambler_register_length: 8  # Scrambler register length
  scrambler_taps:  # Scrambler taps
    - 0
    - 3

# Filter settings
filter:
  rrc_roll_off: 0.5  # RRC roll-off factor
  rrc_filter_span: 10  # RRC filter span
  hardware_filter_enable: false  # Enable hardware filter
  hardware_filter_file: rrc_filter_coefficients.ftr  # Hardware filter file

# Gold sequence settings
gold_sequence:
  code_length: 31  # Gold code length
  code_index: 7  # Gold code index
  correlation_threshold: 0.75  # Correlation threshold

# Synchronization settings
synchronization:
  nfft: 16384  # FFT size. Higher FFT resolution reduces residual CFO before the fine loop, which matters more over the air.
  signal_power_threshold_dB: 66.3  # Threshold level above the measured noise floor in dB for considering a signal presence.
  costas_zeta: 0.707  # Damping factor for Costas loop. A value of 0.707 (1/sqrt(2)) provides critical damping, which is a common choice for stable and responsive loop behavior. Adjust based on desired trade-off between stability and responsiveness.
  costas_K0: 1.0  # VCO gain for Costas loop.
  costas_alpha: 0.02  # Proportional gain for Costas loop (alternative to loop bandwidth). Adjust based on desired loop response. Ignored if costas_loop_bw is set.
  costas_Kp: 0.005  # Proportional gain for the Costas loop.
  costas_Ki: 1.0e-05  # Integral gain for the Costas loop.
  costas_gate_power_percentile_low: 15.0  # Lower power percentile used for Costas update gating on the active symbol region.
  costas_gate_power_percentile_high: 85.0  # Upper power percentile used for Costas update gating on the active symbol region.
  gardner_Kp: 0.004  # Proportional gain for the Gardner timing loop.
  gardner_Ki: 2.0e-05  # Integral gain for the Gardner timing loop.
  gardner_gate_energy_percentile_low: 25.0  # Lower energy percentile used for Gardner update gating.
  gardner_gate_energy_percentile_high: 90.0  # Upper energy percentile used for Gardner update gating.
  gardner_gate_energy_scale_low: 3.0  # Scale factor applied to the lower Gardner gate percentile.
  gardner_gate_energy_scale_high: 3.0  # Scale factor applied to the higher Gardner gate percentile.
  gardner_tracking_payload_symbols: 64  # Number of payload symbols used for Gardner tracking.
  short_equalizer_enable: true  # Enable short equalizer

# Plotter settings
plotter:
  num_rows: 200  # Number of rows in the plot
  center_freq: 865.5e6  # Center frequency in Hz
  time_plot_samples: 500  # Number of samples for time plot
  update_interval: 100  # Update interval in milliseconds
  psd_nperseg: 1024  # Number of points per segment for PSD
  max_constellation_points: 500  # Maximum number of constellation points
  psd_window: hann  # Window function for PSD
  psd_scaling: density
  psd_max_points: 1024
  multi_window: false

plot_capture:
  enabled: false
  output_dir: artifacts/rf_plots
  save_tx_burst: false
  save_rx_gold_detect: false
